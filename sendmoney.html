<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoKo Wallet - Enviar Dinero</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="estilo.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-info">

        <div class="container">

            <a class="navbar-brand fw-bold d-flex align-items-center" href="menu.html">
                <img src="logo.png" alt="Logo JoKo Wallet" width="40" class="me-2">
                JoKo Wallet
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">Depositar</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="sendmoney.html">
                            Enviar Dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-warning fw-bold" href="index.html">
                            Salir
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- CONTENIDO -->
    <main class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow">

                    <div class="card-header bg-warning text-center">
                        <h2 class="mb-0">Enviar Dinero</h2>
                    </div>

                    <div class="card-body">

                        <div class="mb-3">

                            <label for="destinatario" class="form-label">
                                Buscar contacto
                            </label>

                            <input list="contactos"
                                id="destinatario"
                                class="form-control"
                                placeholder="Seleccione un contacto">

                            <datalist id="contactos">
                                <option value="Juan Pérez"></option>
                                <option value="María González"></option>
                                <option value="Carlos Díaz"></option>
                            </datalist>

                        </div>

                        <div class="mb-3">

                            <label for="montoTransferencia" class="form-label">
                                Monto a enviar
                            </label>

                            <input type="number"
                                id="montoTransferencia"
                                class="form-control"
                                placeholder="$ 0">

                        </div>

                        <button id="btnTransferir"
                            class="btn btn-primary w-100 mb-4">
                            Enviar Dinero
                        </button>

                        <hr>

                        <h4 class="text-info mb-3">Agregar Nuevo Contacto</h4>

                        <input type="text"
                            id="nuevoContacto"
                            class="form-control mb-3"
                            placeholder="Nombre del contacto">

                        <button id="btnAgregar"
                            class="btn btn-success">
                            Agregar Contacto
                        </button>

                        <h5 class="mt-4">Mis contactos</h5>

                        <ul id="listaContactos" class="list-group mt-2"></ul>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script del proyecto -->
    <script src="script.js"></script>

</body>

</html>
